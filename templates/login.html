<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>astro| Secure Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Login</title>

    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .login-btn {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 8px #00ff88;
        }

        .login-btn:hover {
            background: #00ff88;
            color: black;
            box-shadow: 0 0 20px #00ff88;
            transform: scale(1.05);
        }

        .login-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="content">
                <h1 style="text-align:center;">Astrox</h1>
                
                <div class="form-group">
                    <input type="email" id="email" placeholder="Enter EMAIL" required>
                    <div class="line"></div>
                </div>

                <div class="form-group">
                    <input type="password" id="password" placeholder="password" required>
                    <div class="line"></div>
                </div>
                
                <form action="/login" method="post">
                 <button class="login-btn">Login</button>
                 </form>
                <div id="status-message"></div>
            </div>
        </div>
    </div>

    

    <script>
        async function connectToDatabase() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('status-message');
            const robot = document.getElementById('robot-gif');

            if(!email || !password) {
                status.className = "error";
                status.innerText = "> Error: Fields empty.";
                return;
            }

            status.className = "processing";
            status.innerText = "> Querying database...";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    status.className = "success";
                    status.innerText = "> Access Granted. Redirecting...";
                    // Activate the GIF on success
                    robot.style.display = "block";
                } else {
                    status.className = "error";
                    status.innerText = "> Denied: " + data.message;
                    robot.style.display = "none";
                }
            } catch (err) {
                status.className = "error";
                status.innerText = "> Critical: Database Offline.";
                robot.style.display = "none";
            }
        }
    </script>
</body>
</html>
